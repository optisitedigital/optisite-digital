<style>
/* ==========================================================
   Optisite Digital — style
   Palette : nuit #0A1230 · bleu ciel #2D8CFF · jaune soleil #F7D618
   (clin d'œil aux couleurs du drapeau de la RDC)
   ========================================================== */
:root {
  --night: #0A1230;
  --night-2: #0F1B45;
  --sky: #2D8CFF;
  --sky-soft: #8CC0FF;
  --sun: #F7D618;
  --mist: #EEF3FC;
  --paper: #FFFFFF;
  --ink: #0A1230;
  --ink-2: #44507A;
  --wa: #25D366;
  --wa-ink: #052E16;
  --violet: #5B3FE0;
  --violet-deep: #3B25B0;
  --line: rgba(10, 18, 48, .12);
  --line-light: rgba(255, 255, 255, .16);

  --f-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --r-xl: 22px;
  --r-md: 14px;
  --wrap: 1200px;
  --pad: clamp(20px, 5vw, 56px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(76px + env(safe-area-inset-top, 0px)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--ink);
  background: var(--night);
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; border-radius: 6px; }

.wrap { width: min(100% - 2 * var(--pad), var(--wrap)); margin-inline: auto; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em;
  border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background-color .2s, color .2s, border-color .2s;
}
.btn--sm { padding: 10px 18px; font-size: .95rem; }
.btn--lg { padding: 16px 28px; font-size: 1.05rem; }
.btn--block { width: 100%; }
.btn--wa { background: var(--wa); color: var(--wa-ink); box-shadow: 0 10px 30px -10px rgba(37, 211, 102, .7); }
.btn--wa:hover { transform: translateY(-2px); box-shadow: 0 16px 36px -10px rgba(37, 211, 102, .85); background: #2FE070; }
.btn--sun { background: var(--sun); color: var(--night); }
.btn--sun:hover { transform: translateY(-2px); background: #FFE23B; }
.btn--ghost { color: #fff; border: 1.5px solid var(--line-light); }
.btn--ghost:hover { border-color: #fff; background: rgba(255, 255, 255, .08); }
.btn--ghost-light { color: #fff; border: 1.5px solid rgba(255, 255, 255, .45); }
.btn--ghost-light:hover { background: rgba(255, 255, 255, .14); border-color: #fff; }
.linkbtn { display: block; margin: 14px auto 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 4px; font-size: .95rem; }
.linkbtn:hover { color: var(--ink); }

/* ---------- Marque ---------- */
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -.02em; }
.brand--light { color: #fff; }
.brand img { object-fit: contain; }
.brand__name span { font-weight: 500; color: var(--sky-soft); }

/* ---------- En-tête ---------- */
.hdr { position: fixed; inset: 0 0 auto 0; z-index: 50; padding-top: env(safe-area-inset-top, 0px); }
/* Le fond flou est sur un pseudo-élément (un backdrop-filter sur .hdr enfermerait les éléments fixed). */
.hdr::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(10, 18, 48, .86); box-shadow: 0 1px 0 var(--line-light);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  opacity: 0; transition: opacity .3s;
}
.hdr--solid::before { opacity: 1; }
.hdr__in { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 20px; }
.nav { display: none; gap: 30px; font-weight: 500; }
.nav a { color: rgba(255, 255, 255, .78); position: relative; padding: 6px 0; transition: color .2s; }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--sun); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); }
.nav a:hover { color: #fff; }
.nav a:hover::after { transform: scaleX(1); }
.hdr__cta { display: none; }
/* Hamburger : tout à droite */
.burger { width: 44px; height: 44px; display: grid; place-items: center; color: #fff; border-radius: 12px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line-light); transition: background-color .2s; }
.burger:hover { background: rgba(255, 255, 255, .16); }

/* Panneau qui sort de la gauche */
.scrim {
  position: fixed; inset: 0; z-index: 60; background: rgba(4, 8, 24, .62);
  opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s;
}
.scrim.is-on { opacity: 1; visibility: visible; transition-delay: 0s; }
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 70;
  width: min(84vw, 330px);
  display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--night); border-right: 1px solid var(--line-light);
  box-shadow: 30px 0 60px -20px rgba(0, 0, 0, .7);
  transform: translateX(-104%); visibility: hidden;
  transition: transform .45s var(--ease), visibility 0s .45s;
}
.drawer.is-open { transform: none; visibility: visible; transition-delay: 0s; }
.drawer__top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.drawer__close { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: #fff; border: 1px solid var(--line-light); }
.drawer__close:hover { background: rgba(255, 255, 255, .1); }
.drawer__nav { display: flex; flex-direction: column; margin-top: 14px; }
.drawer__nav a {
  font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: -.02em; color: #fff;
  padding: 15px 4px; border-bottom: 1px solid var(--line-light);
  opacity: 0; transform: translateX(-18px);
  transition: opacity .4s var(--ease), transform .4s var(--ease), color .2s;
}
.drawer.is-open .drawer__nav a { opacity: 1; transform: none; transition-delay: calc(var(--i) * 55ms + 160ms); }
.drawer__nav a:hover { color: var(--sun); }
.drawer__foot { margin-top: auto; display: grid; gap: 12px; padding-top: 24px; }
.drawer__mail { display: flex; align-items: center; gap: 10px; color: rgba(255, 255, 255, .82); font-size: .95rem; overflow-wrap: anywhere; }
.drawer__tel { color: rgba(255, 255, 255, .6); font-size: .9rem; }

@media (min-width: 900px) {
  .hdr__in { height: 72px; }
  .nav { display: flex; }
  .hdr__cta { display: inline-flex; }
  .burger, .drawer, .scrim { display: none; }
}

/* ---------- Hero ---------- */
.hero {
  --mx: 75%; --my: 30%;
  position: relative; isolation: isolate; overflow: clip;
  min-height: 100svh; display: flex; align-items: center;
  padding: calc(110px + env(safe-area-inset-top, 0px)) 0 72px;
  color: #fff; background: var(--night);
}
.hero__glow {
  position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(520px circle at var(--mx) var(--my), rgba(45, 140, 255, .32), transparent 65%),
    radial-gradient(700px 400px at 90% 10%, rgba(45, 140, 255, .18), transparent 70%),
    radial-gradient(500px 300px at 0% 100%, rgba(247, 214, 24, .08), transparent 70%);
}
.hero__glow::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 30% 40%, #000 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 30% 40%, #000 20%, transparent 75%);
}
.hero__in { display: grid; gap: 56px; align-items: center; }
.hero h1 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(2.6rem, 7.4vw, 5.2rem); line-height: 1.02; letter-spacing: -.035em;
  text-wrap: balance;
}
.hw { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
.hw__in { display: inline-block; transform: translateY(110%); animation: rise .95s var(--ease) forwards; animation-delay: calc(var(--i) * 75ms + 150ms); }
@keyframes rise { to { transform: none; } }

.hero__type { margin-top: 26px; font-family: var(--f-display); font-weight: 500; font-size: clamp(1.1rem, 2.4vw, 1.45rem); color: #fff; min-height: 1.6em; }
.typer { color: var(--sky-soft); }
.typer__caret { display: inline-block; width: 2px; height: 1.05em; margin-left: 3px; vertical-align: -.15em; background: var(--sun); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero__lead { margin-top: 18px; max-width: 34em; color: rgba(255, 255, 255, .74); font-size: 1.1rem; }
.hero__cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
.hero__note { margin-top: 22px; display: flex; align-items: center; gap: 10px; color: rgba(255, 255, 255, .62); font-size: .95rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wa); box-shadow: 0 0 0 4px rgba(37, 211, 102, .25); }

.hero__copy > * { animation: fadein .8s var(--ease) both; }
.hero__copy > h1 { animation: none; }
.hero__type { animation-delay: .9s !important; }
.hero__lead { animation-delay: 1s !important; }
.hero__cta { animation-delay: 1.1s !important; }
.hero__note { animation-delay: 1.2s !important; }
@keyframes fadein { from { opacity: 0; transform: translateY(14px); } }

/* Fenêtre 3D */
.stage { perspective: 1500px; padding: 26px 18px; animation: stagein 1.2s var(--ease) .5s both; }
@keyframes stagein { from { opacity: 0; transform: translateY(40px) scale(.96); } }
.win {
  --rx: 4deg; --ry: -8deg;
  position: relative; transform-style: preserve-3d;
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  transition: transform .35s var(--ease);
  border-radius: 18px; background: #101a40; border: 1px solid rgba(255, 255, 255, .16);
  box-shadow: 0 50px 90px -30px rgba(0, 0, 0, .75), 0 0 0 1px rgba(45, 140, 255, .12), 0 0 140px -30px rgba(45, 140, 255, .55);
}
.win__bar { display: flex; align-items: center; gap: 7px; padding: 12px 16px; background: #131f4d; border-radius: 18px 18px 0 0; }
.win__bar > i { width: 11px; height: 11px; border-radius: 50%; background: rgba(255, 255, 255, .22); }
.win__url { margin-left: 10px; flex: 1; display: flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--sky-soft); font-size: .8rem; }
.win__url svg { color: var(--wa); }
.win__screen { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0c1433; }
.slide { position: absolute; inset: 0; display: block; opacity: 0; transform: scale(1.06); transition: opacity .8s var(--ease), transform 1.4s var(--ease); }
.slide.is-on { opacity: 1; transform: none; z-index: 1; }
.slide img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.win__dots { display: flex; justify-content: center; gap: 4px; padding: 6px 0 10px; background: #101a40; border-radius: 0 0 18px 18px; }
.win__dots button { padding: 10px 6px; }
.win__dots span { display: block; width: 26px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .22); position: relative; overflow: hidden; }
.win__dots .is-on span::after { content: ""; position: absolute; inset: 0; background: var(--sun); transform-origin: left; animation: prog 4.2s linear forwards; }
.stage:hover .win__dots .is-on span::after { animation-play-state: paused; }
@keyframes prog { from { transform: scaleX(0); } }

.chip {
  position: absolute; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-radius: 999px; font-family: var(--f-display); font-weight: 700; font-size: .85rem; white-space: nowrap;
  background: #fff; color: var(--night); box-shadow: 0 16px 36px -10px rgba(0, 0, 0, .55);
}
.chip svg { color: var(--wa-ink); }
.chip--a { left: -10px; bottom: 14%; transform: translateZ(70px); }
.chip--b { right: -6px; top: -18px; transform: translateZ(90px); background: var(--wa); color: var(--wa-ink); }

@media (min-width: 960px) {
  .hero__in { grid-template-columns: 1.02fr .98fr; gap: 40px; }
  .stage { padding: 30px 26px 30px 6px; }
  .chip--a { left: -34px; }
  .chip--b { right: -8px; }
}
@media (max-width: 520px) {
  .chip--a { left: 4px; }
  .chip--b { right: 4px; }
  .chip { font-size: .78rem; padding: 7px 11px; }
  .win { --rx: 0deg; --ry: 0deg; }
}

/* ---------- Sections ---------- */
.sect { padding: clamp(72px, 10vw, 128px) 0; }
.sect--light { background: var(--mist); color: var(--ink); }
.sect--paper { background: var(--paper); color: var(--ink); }
.sect--dark { background: var(--night-2); color: #fff; }
.sect--violet { background: linear-gradient(160deg, var(--violet) 0%, var(--violet-deep) 100%); color: #fff; }
.sect__head { max-width: 46rem; margin-bottom: clamp(36px, 6vw, 64px); }
.sect__sub { margin-top: 18px; font-size: 1.15rem; color: var(--ink-2); max-width: 40em; }
.sect--dark .sect__sub, .sect--violet .sect__sub { color: rgba(255, 255, 255, .78); }

.split {
  font-family: var(--f-display); font-weight: 700; letter-spacing: -.03em; line-height: 1.06;
  font-size: clamp(2rem, 5vw, 3.4rem); text-wrap: balance;
}
.split__mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .12em; margin-bottom: -.12em; }
.split__word { display: inline-block; transform: translateY(110%); transition: transform .9s var(--ease); transition-delay: calc(var(--i) * 55ms); }
.split.is-in .split__word { transform: none; }

.reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease) var(--d, 0ms), transform .8s var(--ease) var(--d, 0ms); }
.reveal.is-in { opacity: 1; transform: none; }

/* Services */
.svc__row { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: var(--r-xl); background: #fff; border: 1px solid var(--line); position: relative; }
.svc__icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--night); color: var(--sun); transition: transform .4s var(--ease); }
.svc__main strong { display: block; font-family: var(--f-display); font-size: 1.3rem; letter-spacing: -.02em; line-height: 1.15; }
.svc__main span { display: block; margin-top: 6px; color: var(--ink-2); font-size: .98rem; line-height: 1.5; }
.svc__tags { display: none; }
.svc__go { position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); }
@media (min-width: 900px) {
  .svc { display: block; border-top: 1px solid var(--line); }
  .svc__row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 8px 22px; align-items: start;
    padding: 30px 8px; border-radius: 0; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    transition: background-color .3s, padding .4s var(--ease);
  }
  .svc__row:hover { background: #fff; padding-inline: 22px; }
  .svc__icon { grid-row: span 2; width: 56px; height: 56px; border-radius: 16px; }
  .svc__row:hover .svc__icon { transform: rotate(-8deg) scale(1.06); }
  .svc__main strong { font-size: clamp(1.4rem, 2.6vw, 1.9rem); }
  .svc__main span { margin-top: 8px; max-width: 44em; font-size: 1.0625rem; }
  .svc__tags { display: flex; grid-column: 2; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .svc__tags em { font-style: normal; font-size: .85rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: rgba(255, 255, 255, .6); }
  .svc__go { position: static; grid-column: 3; grid-row: 1; width: 44px; height: 44px; transition: background-color .25s, color .25s, border-color .25s, transform .4s var(--ease); }
  .svc__row:hover .svc__go { background: var(--wa); border-color: var(--wa); color: var(--wa-ink); transform: rotate(45deg); }
}

/* Réalisations */
@media (min-width: 900px) {
  .prj { display: grid; grid-template-columns: repeat(6, 1fr); gap: 28px; }
  .prj__cell { grid-column: span 2; }
  .prj__cell--0, .prj__cell--1 { grid-column: span 3; }
}
.card { display: block; }
.card__shot {
  position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: var(--r-xl);
  background: #0c1433; border: 1px solid var(--line-light);
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .7);
  transition: transform .5s var(--ease), box-shadow .5s var(--ease), border-color .3s;
}
.card__shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: transform .8s var(--ease); }
.card__shot .mock { transition: transform .8s var(--ease); }
.card:hover .card__shot { transform: translateY(-6px); border-color: rgba(247, 214, 24, .6); box-shadow: 0 40px 70px -30px rgba(45, 140, 255, .55); }
.card:hover .card__shot img, .card:hover .card__shot .mock { transform: scale(1.05); }
.card__open {
  position: absolute; left: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 999px; background: var(--sun); color: var(--night);
  font-family: var(--f-display); font-weight: 700; font-size: .92rem;
  opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .4s var(--ease);
}
.card:hover .card__open, .card:focus-visible .card__open { opacity: 1; transform: none; }
.card__meta { display: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 4px 0; }
.card__meta strong { font-family: var(--f-display); font-size: 1.2rem; letter-spacing: -.01em; }
.card__meta span { color: rgba(255, 255, 255, .6); font-size: .95rem; }
.prj__more { margin-top: clamp(44px, 6vw, 72px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 32px; padding: clamp(24px, 4vw, 36px); border-radius: var(--r-xl); border: 1px solid var(--line-light); background: rgba(255, 255, 255, .04); }
.prj__more p { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.3rem, 2.6vw, 1.8rem); letter-spacing: -.02em; max-width: 20em; line-height: 1.2; }

/* Maquette de secours (quand l'image n'existe pas encore) */
.mock { --tone: #2D8CFF; width: 100%; height: 100%; padding: 6% 7%; display: flex; flex-direction: column; gap: 6%; background: linear-gradient(180deg, #16234f, #0d1638); }
.mock__nav { display: flex; align-items: center; gap: 4%; }
.mock__nav i { width: 8%; aspect-ratio: 1; border-radius: 50%; background: var(--tone); }
.mock__nav b { width: 10%; height: 5px; border-radius: 4px; background: rgba(255, 255, 255, .28); }
.mock__nav b:nth-of-type(1) { margin-left: auto; }
.mock__nav em { width: 14%; height: 12px; border-radius: 99px; background: var(--tone); }
.mock__hero { flex: 1; display: grid; grid-template-columns: 1.1fr .9fr; gap: 8%; align-items: center; }
.mock__hero > div:first-child { display: flex; flex-direction: column; gap: 10px; }
.mock__hero span { display: block; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, .88); }
.mock__hero u { display: block; width: 44%; height: 16px; border-radius: 99px; background: var(--tone); margin-top: 6px; }
.mock__art { height: 100%; min-height: 60px; border-radius: 14px; background: linear-gradient(135deg, var(--tone), rgba(255, 255, 255, .18)); }
.mock__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5%; height: 22%; }
.mock__row i { border-radius: 10px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .1); }

/* Formation */
.train { display: grid; gap: 28px; }
.train__card { margin-top: 20px; padding: 18px; border-radius: var(--r-xl); background: var(--night); color: #fff; display: grid; gap: 14px; }
.train__card ul { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.train__card li { display: flex; gap: 8px; align-items: center; font-size: .95rem; }
.train__card li svg { color: var(--sun); flex: none; }
.steps__item { padding: 22px; border-radius: var(--r-xl); background: var(--mist); border: 1px solid var(--line); }
.steps__n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 12px; font-family: var(--f-display); font-weight: 700; background: var(--sun); color: var(--night); }
.steps h3 { font-family: var(--f-display); font-size: 1.3rem; letter-spacing: -.02em; line-height: 1.2; }
.steps p { margin-top: 6px; color: var(--ink-2); font-size: .98rem; line-height: 1.5; }
@media (min-width: 900px) {
  .train { grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
  .train__side { position: sticky; top: 110px; }
  .train__card { margin-top: 32px; padding: 26px; gap: 22px; }
  .train__card ul { display: block; }
  .train__card li { padding: 6px 0; gap: 12px; font-size: 1.0625rem; }
  .steps { position: relative; display: grid; gap: 8px; }
  .steps::before { content: ""; position: absolute; left: 21px; top: 24px; bottom: 24px; width: 2px; background: linear-gradient(var(--sky), var(--sun)); opacity: .5; }
  .steps__item { position: relative; padding: 0 0 26px 68px; background: transparent; border: 0; border-radius: 0; }
  .steps__n { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: 0; box-shadow: 0 0 0 6px var(--paper); }
  .steps h3 { font-size: 1.45rem; padding-top: 8px; }
  .steps p { margin-top: 8px; max-width: 32em; font-size: 1.0625rem; }
}

/* Kontra Africa */
.kon { display: grid; gap: 32px; align-items: center; }
.kon__feats { margin-top: 0; }
.kon__feat { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); }
.kon__feat > span { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .22); }
.kon__feat strong { font-family: var(--f-display); font-size: 1.1rem; }
.kon__feat p { color: rgba(255, 255, 255, .8); font-size: .95rem; line-height: 1.45; margin-top: 2px; }
@media (min-width: 900px) {
  .kon__feats { display: grid; gap: 18px; margin-top: 32px; }
  .kon__feat { flex-direction: row; gap: 16px; align-items: flex-start; padding: 0; background: none; border: 0; border-radius: 0; }
  .kon__feat > span { width: 46px; height: 46px; border-radius: 14px; }
  .kon__feat p { font-size: 1rem; }
}
.kon__cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.kon__price { margin-top: 18px; color: rgba(255, 255, 255, .8); font-size: .98rem; }
.kon__visual { display: grid; place-items: center; }
.phone { width: min(320px, 100%); padding: 16px 14px 20px; border-radius: 38px; background: #14112e; border: 8px solid #0b0920; box-shadow: 0 50px 80px -30px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .18); display: grid; gap: 12px; transform: rotate(3deg); }
.phone__top { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: .95rem; padding: 6px 0 8px; color: #fff; }
.ph-card { padding: 14px; border-radius: 16px; background: #fff; color: var(--night); }
.ph-card--sign { background: linear-gradient(135deg, #fff, #ECE8FF); }
.ph-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; font-size: .92rem; }
.ph-line b { font-size: .74rem; padding: 3px 10px; border-radius: 99px; background: var(--mist); }
.ph-line .ph-ok { display: inline-flex; align-items: center; gap: 4px; background: #D4F7E1; color: #0B6B33; }
.ph-line .ph-low { background: #FFE2DA; color: #A3290F; }
.ph-sub { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink-2); }
.ph-sub svg { color: #1FA855; }
.ph-bar { margin-top: 12px; height: 8px; border-radius: 8px; background: #EEF0F8; overflow: hidden; }
.ph-bar i { display: block; height: 100%; background: #F0553A; border-radius: 8px; }
.ph-chart { margin-top: 12px; height: 70px; display: flex; align-items: flex-end; gap: 8px; }
.ph-chart i { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(var(--violet), #8E78FF); }
@media (min-width: 960px) { .kon { grid-template-columns: 1.1fr .9fr; gap: 80px; } }

/* Commande */
.ord { display: grid; gap: 48px; }
.ord__contact { margin-top: 36px; display: grid; gap: 14px; }
.ord__contact a { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: var(--r-md); background: #fff; border: 1px solid var(--line); transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .2s; }
.ord__contact a:hover { transform: translateY(-2px); box-shadow: 0 18px 36px -20px rgba(10, 18, 48, .35); border-color: rgba(10, 18, 48, .3); }
.ord__contact small { display: block; color: var(--ink-2); font-size: .85rem; line-height: 1.2; }
.ord__contact strong { font-family: var(--f-display); font-size: 1.1rem; overflow-wrap: anywhere; }
.ico { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.ico--wa { background: var(--wa); color: var(--wa-ink); }
.ico--mail { background: var(--night); color: var(--sun); }
.ord__form { padding: clamp(22px, 4vw, 36px); border-radius: var(--r-xl); background: #fff; border: 1px solid var(--line); box-shadow: 0 40px 70px -40px rgba(10, 18, 48, .45); }
.fld { display: block; margin: 0 0 20px; padding: 0; border: 0; min-width: 0; }
.fld > span, .fld > legend { display: block; margin-bottom: 8px; font-weight: 700; font-size: .98rem; padding: 0; }
.fld small { font-weight: 400; color: var(--ink-2); }
.fld input, .fld textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--mist);
  border: 1.5px solid transparent; border-radius: 12px; padding: 14px 16px; resize: vertical;
  transition: border-color .2s, background-color .2s, box-shadow .2s;
}
.fld input::placeholder, .fld textarea::placeholder { color: #7A86A8; }
.fld input:hover, .fld textarea:hover { background: #E6EDFA; }
.fld input:focus, .fld textarea:focus { outline: none; background: #fff; border-color: var(--sky); box-shadow: 0 0 0 4px rgba(45, 140, 255, .18); }
.fld input[aria-invalid="true"] { border-color: #D93A1C; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-weight: 500; transition: background-color .2s, color .2s, border-color .2s, transform .2s var(--ease); }
.chips button:hover { border-color: var(--ink); }
.chips button.is-on { background: var(--night); color: #fff; border-color: var(--night); }
.chips button:active { transform: scale(.96); }
.bubble { margin: 4px 0 18px; padding: 14px 16px 14px; border-radius: 16px 16px 16px 4px; background: #DCF8C6; color: #0B2A14; }
.bubble small { display: block; font-size: .78rem; color: #3E6B4B; margin-bottom: 4px; font-weight: 700; }
.bubble p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .98rem; line-height: 1.5; }
.ord__err { min-height: 1.4em; margin-bottom: 8px; color: #C0311A; font-weight: 500; font-size: .95rem; }
@media (min-width: 960px) { .ord { grid-template-columns: .9fr 1.1fr; gap: 72px; align-items: start; } .ord__copy { position: sticky; top: 110px; } }

/* Pied de page */
.ftr { background: var(--night); color: #fff; padding: 64px 0 calc(28px + env(safe-area-inset-bottom, 0px)); }
.ftr__in { display: grid; gap: 36px; }
.ftr__tag { margin-top: 14px; color: rgba(255, 255, 255, .62); max-width: 22em; }
.ftr__nav, .ftr__contact { display: flex; flex-direction: column; gap: 10px; }
.ftr__nav a, .ftr__contact a { color: rgba(255, 255, 255, .78); width: fit-content; transition: color .2s; }
.ftr__nav a:hover, .ftr__contact a:hover { color: var(--sun); }
.ftr__copy { margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line-light); color: rgba(255, 255, 255, .5); font-size: .92rem; }
@media (min-width: 800px) { .ftr__in { grid-template-columns: 1.4fr 1fr 1.2fr; } }

/* Bouton WhatsApp flottant */
.fab {
  position: fixed; z-index: 40; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center;
  background: var(--wa); color: var(--wa-ink); box-shadow: 0 16px 34px -8px rgba(37, 211, 102, .75);
  opacity: 0; transform: translateY(20px) scale(.8); pointer-events: none;
  transition: opacity .4s var(--ease), transform .5s var(--ease);
}
.fab.is-on { opacity: 1; transform: none; pointer-events: auto; }
.fab:hover { transform: scale(1.08); }


/* ---------- Image d'accueil (lien direct) ---------- */
.hero__bg { position: absolute; inset: 0; z-index: -2; overflow: hidden; background: var(--night); }
.hero__bg img { width: 100%; height: 100%; object-fit: cover; object-position: center; transform: scale(1.05); animation: bgin 1.8s var(--ease) both; }
@keyframes bgin { from { opacity: 0; transform: scale(1.12); } }
.hero__bg::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10, 18, 48, .80) 0%, rgba(10, 18, 48, .88) 55%, var(--night) 100%);
}
@media (min-width: 900px) {
  .hero__bg::after {
    background:
      linear-gradient(90deg, rgba(10, 18, 48, .95) 0%, rgba(10, 18, 48, .78) 48%, rgba(10, 18, 48, .55) 100%),
      linear-gradient(180deg, transparent 65%, var(--night) 100%);
  }
}

/* ---------- Bandeau qui défile ---------- */
.ticker { background: var(--sun); color: var(--night); overflow: hidden; }
.ticker__track { display: flex; width: max-content; animation: marquee 34s linear infinite; }

.ticker span { display: inline-flex; align-items: center; gap: 22px; padding: 13px 22px 13px 0; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; white-space: nowrap; }

  .fab { width: 54px; height: 54px; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
}
