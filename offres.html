<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offres d'Emploi | OptiSite Digital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --navy-deep: #0b0e26;
    --blue-1: #2f5bf6;
    --blue-2: #5b7cf7;
    --text-muted: #6b7094;
    --green-active: #0f9d6e;
    --green-active-bg: rgba(52,211,153,0.14);
    --red-expired: #d84343;
    --red-expired-bg: rgba(248,113,113,0.14);
    --wa-green: #25d366;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #eef0f7;
    color: var(--navy-deep);
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #e4e6f2;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header img {
    height: 44px;
    width: auto;
    object-fit: contain;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    justify-content: center;
  }

  .filter-btn {
    background: #fff;
    border: 1px solid #dcdfec;
    color: #383e5c;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-btn.active {
    background: var(--navy-deep);
    color: #fff;
    border-color: var(--navy-deep);
  }

  .status-msg {
    text-align: center;
    color: #6b7094;
    padding: 60px 0;
    font-size: 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  .card {
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid #e4e6f2;
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(20,25,60,0.08);
  }

  .card.expired { opacity: 0.68; }

  .card-img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    background: #f1f2fa;
    display: block;
  }

  .card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-grow: 1;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-title {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.3;
  }

  .badge-status {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .badge-active { background: var(--green-active-bg); color: var(--green-active); }
  .badge-expired { background: var(--red-expired-bg); color: var(--red-expired); }

  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .meta-tag {
    font-size: 12px;
    font-weight: 600;
    color: #565c80;
    background: #f1f2fa;
    padding: 5px 11px;
    border-radius: 8px;
  }

  .card-desc {
    color: #565c80;
    font-size: 13.5px;
    line-height: 1.6;
    flex-grow: 1;
    white-space: pre-line;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #eef0f8;
    font-size: 11.5px;
    color: #8b90ac;
  }

  .apply-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--wa-green);
    color: #fff;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
  }

  .apply-btn.disabled {
    background: #d4d6e4;
    color: #8b90ac;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    main { padding: 16px 12px 50px; }
    .grid { grid-template-columns: 1fr; }
    header img { height: 38px; }
  }
</style>
</head>
<body>

  <header>
    <img src="Logo Optisite.jpg" alt="OptiSite Digital">
  </header>

  <main>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Toutes les offres</button>
      <button class="filter-btn" data-filter="active">Offres actives</button>
      <button class="filter-btn" data-filter="expired">Offres expirées</button>
    </div>

    <div id="content">
      <p class="status-msg">Chargement des offres...</p>
    </div>
  </main>

<script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdMGkhmyoflnlC4iFEG2xvoAIyv0Vu1x7Ca842rbrKifFv7QWodgkLj-Nk-sDIjyrKfmt4msdHZbCM/pub?gid=1673870451&single=true&output=csv";

  let allJobs = [];
  let currentFilter = "all";

  function parseDate(str) {
    if (!str) return null;
    const d = new Date(String(str).trim());
    return isNaN(d.getTime()) ? null : d;
  }

  function isExpired(job) {
    if (!job.dateFinObj) return false;
    const today = new Date();
    today.setHours(0,0,0,0);
    const fin = new Date(job.dateFinObj);
    fin.setHours(0,0,0,0);
    return fin < today;
  }

  function formatDate(d) {
    if (!d) return "—";
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function buildWhatsappLink(job) {
    if (!job.whatsapp) return null;
    const numero = String(job.whatsapp).replace(/[^0-9]/g, '');
    const message = `Bonjour, je suis intéressé(e) par l'offre : ${job.titre}. Pouvez-vous me donner plus d'informations ?`;
    return `https://wa.me/${numero}?text=${encodeURIComponent(message)}`;
  }

  function renderJobs() {
    const container = document.getElementById('content');
    let jobs = allJobs;

    if (currentFilter === "active") jobs = allJobs.filter(j => !isExpired(j));
    if (currentFilter === "expired") jobs = allJobs.filter(j => isExpired(j));

    if (jobs.length === 0) {
      container.innerHTML = '<p class="status-msg">Aucune offre à afficher pour le moment.</p>';
      return;
    }

    container.innerHTML = '<div class="grid">' + jobs.map(job => {
      const expired = isExpired(job);
      const waLink = buildWhatsappLink(job);
      return `
        <div class="card ${expired ? 'expired' : ''}">
          ${job.image ? `<img class="card-img" src="${job.image}" alt="${job.titre}" onerror="this.style.display='none'">` : ''}
          <div class="card-body">
            <div class="card-top">
              <div class="card-title">${job.titre}</div>
              <span class="badge-status ${expired ? 'badge-expired' : 'badge-active'}">
                ${expired ? 'Expirée' : 'Active'}
              </span>
            </div>
            <div class="meta-row">
              ${job.type ? `<span class="meta-tag">${job.type}</span>` : ''}
              ${job.lieu ? `<span class="meta-tag">📍 ${job.lieu}</span>` : ''}
            </div>
            <p class="card-desc">${job.description || ''}</p>
            ${waLink
              ? `<a href="${expired ? '#' : waLink}" target="_blank" class="apply-btn ${expired ? 'disabled' : ''}">
                   ${expired ? '⛔ Candidature fermée' : '💬 Postuler sur WhatsApp'}
                 </a>`
              : ''
            }
            <div class="card-footer">
              <span>Publié le ${formatDate(job.datePubObj)}</span>
              <span>Fin: ${formatDate(job.dateFinObj)}</span>
            </div>
          </div>
        </div>
      `;
    }).join('') + '</div>';
  }

  function loadJobs() {
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allJobs = results.data.map(row => ({
          id: row.ID,
          titre: row.Titre,
          type: row.Type,
          lieu: row.Lieu,
          description: row.Description,
          image: row.Image,
          datePubObj: parseDate(row.Date_Publication),
          dateFinObj: parseDate(row.Date_Fin),
          whatsapp: row.WhatsApp
        })).filter(j => j.titre);

        allJobs.sort((a,b) => {
          const aExp = isExpired(a), bExp = isExpired(b);
          if (aExp !== bExp) return aExp ? 1 : -1;
          return (b.datePubObj || 0) - (a.datePubObj || 0);
        });

        renderJobs();
      },
      error: function() {
        document.getElementById('content').innerHTML =
          '<p class="status-msg">Impossible de charger les offres. Vérifie le lien Google Sheets.</p>';
      }
    });
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderJobs();
    });
  });

  loadJobs();
</script>

</body>
</html>
