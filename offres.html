<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Offres d'Emploi - OptiSite Digital</title>
    
    <link rel="icon" type="image/jpg" href="Logo Optisite.jpg">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #2563eb; 
            --dark: #0f172a; 
            --bg: #f4f7ff; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--dark); line-height: 1.6; }
        
        .container { max-width: 900px; margin: auto; padding: 40px 20px; }
        
        /* HEADER AVEC LE LOGO VISIBLE AUSSI SUR LA PAGE */
        .header { text-align: center; margin-bottom: 50px; }
        .header img { height: 80px; margin-bottom: 15px; border-radius: 10px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--dark); }
        .header p { color: var(--primary); font-weight: 600; letter-spacing: 1px; }

        #job-list { display: flex; flex-direction: column; gap: 40px; }

        .job-card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            transition: transform 0.3s ease;
        }

        .job-card:hover { transform: translateY(-5px); }
        
        .job-card img { 
            width: 100%; 
            display: block;
            height: auto; 
            border-bottom: 4px solid var(--primary);
        }

        .job-content { padding: 30px; }
        .job-content h2 { margin: 0 0 15px 0; color: var(--dark); font-size: 1.8rem; }
        .job-content p { color: #64748b; font-size: 1.1rem; }

        .loading, .error { text-align: center; padding: 50px; font-weight: 600; color: #64748b; }

        footer { text-align: center; color: #94a3b8; padding: 40px 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <img src="Logo Optisite.jpg" alt="Logo OptiSite Digital">
            <h1>Opportunités Recrutement</h1>
            <p>OPTISITE DIGITAL</p>
        </div>

        <div id="job-list">
            <p class="loading"><i class="fas fa-spinner fa-spin"></i> Recherche des meilleures offres...</p>
        </div>

        <footer>
            &copy; 2026 OptiSite Digital. Tous droits réservés.
        </footer>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTh4TLAZTOkTzKCfHk1RaDJ-Rs9I65QGB6XftGoKYZlXYGjRsnmopK7Z4WbC9mtFlgoRDFX8f_Yd9FN/pub?output=csv';

        async function loadJobs() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); 
                const list = document.getElementById('job-list');
                list.innerHTML = '';

                let hasJobs = false;

                rows.forEach(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if (cols.length >= 2 && cols[0].trim() !== "") {
                        hasJobs = true;
                        const titre = cols[0].replace(/"/g, "").trim();
                        const photo = cols[1].replace(/"/g, "").trim();
                        const desc = cols[2] ? cols[2].replace(/"/g, "").trim() : "";

                        list.innerHTML += `
                            <div class="job-card">
                                <img src="${photo}" alt="${titre}" onerror="this.src='https://via.placeholder.com/800x400?text=Image+Indisponible'">
                                <div class="job-content">
                                    <h2>${titre}</h2>
                                    <p>${desc}</p>
                                </div>
                            </div>
                        `;
                    }
                });

                if(!hasJobs) {
                    list.innerHTML = "<p class='loading'>Aucune offre disponible pour le moment.</p>";
                }

            } catch (e) {
                document.getElementById('job-list').innerHTML = "<p class='error'>Erreur de connexion.</p>";
            }
        }

        loadJobs();
    </script>
</body>
</html>
