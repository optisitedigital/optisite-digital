<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bureau">
<title>Bureau Digital — OptiSite</title>
<link rel="manifest" href="bureau-manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){
  function show(msg){
    try{
      var r=document.getElementById('root');
      if(r&&!r.firstChild){
        r.innerHTML='<div style="padding:24px;font-family:Arial,sans-serif;color:#12153a"><b>L’application n’a pas pu démarrer.</b><p style="margin-top:10px;color:#5a6082;word-break:break-word">'+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p><p style="margin-top:10px;color:#5a6082">Recharge la page. Si ça continue, envoie une capture de ce message.</p></div>';
      }
    }catch(x){}
  }
  window.addEventListener('error',function(e){show((e.message||'Erreur')+' (ligne '+(e.lineno||'?')+')')});
  window.addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message?e.reason.message:'Erreur inattendue')});
  setTimeout(function(){var r=document.getElementById('root');if(r&&!r.firstChild)show('Aucun écran affiché.')},4000);
})();
</script>
<style>
:root{
  --blue:#1b8ccf;--indigo:#2f4a9e;--purple:#47217a;--white:#fff;
  --bg:#f4f7fd;--text:#12153a;--muted:#5a6082;--line:#e3e8f4;
  --ok:#16a34a;--bad:#dc2626;--pink:#e11d48;
  --grad:linear-gradient(135deg,var(--blue) 0%,var(--indigo) 55%,var(--purple) 100%);
  --nav-h:64px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-radius:0!important;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Poppins","Segoe UI",Arial,sans-serif;background:#dfe5f5;color:var(--text);line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
svg.i{width:1.3em;height:1.3em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}

/* ---------- Cadre de l'application ---------- */
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(47,74,158,.25)}
#root{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

/* ---------- Écrans d'accueil / connexion ---------- */
.auth{flex:1;overflow-y:auto;padding:28px 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}
.auth-in{position:relative;z-index:1;margin:auto 0;display:flex;flex-direction:column;gap:14px}
.mesh{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;filter:blur(70px);opacity:.3;transform:rotate(45deg);animation:float 10s ease-in-out infinite}
.b1{width:280px;height:280px;background:var(--blue);top:-70px;right:-90px}
.b2{width:260px;height:260px;background:var(--purple);bottom:-80px;left:-90px;animation-delay:-4s}
.logo-big{width:76px;height:76px}
.tag{display:inline-block;align-self:flex-start;padding:6px 14px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--indigo);color:var(--indigo);font-weight:600;font-size:.78rem;box-shadow:3px 3px 0 rgba(47,74,158,.1)}
h1{font-size:1.75rem;line-height:1.2;font-weight:800}
.lead{color:var(--muted)}
.demo-note{font-size:.76rem;color:var(--muted);border:1px dashed #b6c0e0;padding:10px 12px;background:rgba(255,255,255,.7)}
.link-btn{background:none;border:0;color:var(--indigo);font-weight:600;padding:10px;text-decoration:underline;text-underline-offset:4px}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;padding:4px 0}
.back svg{transform:rotate(180deg)}

/* ---------- Boutons ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:14px 24px;font-weight:700;font-size:1rem;border:2px solid transparent;text-align:center;transition:transform .15s ease,box-shadow .15s ease,background-size .3s ease,color .25s ease}
.btn-block{width:100%}
.btn-primary{background:var(--grad);color:#fff;box-shadow:5px 5px 0 rgba(71,33,122,.3)}
.btn-ok{background:var(--ok);color:#fff;box-shadow:4px 4px 0 rgba(10,90,40,.3)}
.btn-no{background:#fff;color:var(--bad);border-color:var(--bad);box-shadow:4px 4px 0 rgba(220,38,38,.15)}
.btn-primary:active,.btn-ok:active,.btn-no:active{transform:translate(4px,4px);box-shadow:1px 1px 0 rgba(71,33,122,.3)}
.btn-outline{color:var(--indigo);border-color:var(--indigo);background:linear-gradient(var(--indigo),var(--indigo)) no-repeat left/0% 100%}
.btn-outline:active{background-size:100% 100%;color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{min-height:44px;padding:9px 16px;font-size:.88rem}
.rip{position:absolute;width:12px;height:12px;background:rgba(255,255,255,.55);transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn-outline .rip,.btn-no .rip,.opt .rip,.nav .rip{background:rgba(47,74,158,.22)}

/* ---------- Formulaires ---------- */
.field{display:grid;gap:6px;margin-bottom:12px}
.field label,.lbl{font-weight:600;font-size:.8rem;color:var(--muted)}
input,select,textarea{width:100%;padding:13px 14px;border:2px solid var(--line);background:#fff;font-size:16px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--indigo);box-shadow:4px 4px 0 rgba(47,74,158,.15)}
.err{color:var(--bad);font-weight:600;font-size:.85rem;min-height:1.2em;margin-bottom:6px}
.note{font-size:.82rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px;border:2px solid var(--line);background:#fff;font-weight:700;transition:all .2s}
.seg input:checked+span{border-color:var(--indigo);background:var(--grad);color:#fff;box-shadow:4px 4px 0 rgba(71,33,122,.25)}

/* ---------- Caméra ---------- */
.cam{position:relative;aspect-ratio:1/1;background:#0b0d24;overflow:hidden;box-shadow:8px 8px 0 rgba(47,74,158,.2);margin-bottom:12px}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam::after{content:"";position:absolute;inset:14%;border:2px dashed rgba(255,255,255,.7);pointer-events:none}
.cam.done::after{display:none}
.steps{display:flex;gap:8px;margin-bottom:6px}
.steps i{flex:1;height:5px;background:var(--line)}
.steps i.on{background:var(--grad)}

/* ---------- Application : barre du haut, zone centrale, navigation ---------- */
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
.top img{width:36px;height:36px}
.top b{font-weight:800;font-size:1rem}
.top .chip{margin-left:auto;font-size:.7rem;font-weight:700;color:#fff;background:var(--grad);padding:4px 10px}
.top .icon-btn{background:none;border:0;color:var(--muted);padding:6px;display:grid;place-items:center}
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 36px;position:relative}
.main.chatmode{padding:0;display:flex;flex-direction:column;overflow:hidden}
.nav{flex:none;position:relative;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px rgba(47,74,158,.08)}
.nav button{position:relative;overflow:visible;border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);transition:color .2s}
.nav button svg{width:1.55em;height:1.55em;transition:transform .2s}
.nav button.on{color:var(--indigo)}
.nav button.on svg{transform:translateY(-2px) scale(1.08)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--grad);animation:grow .3s ease}
.nav button:active svg{transform:scale(.88)}
.plus-btn{width:54px;height:54px;margin-top:-26px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:4px 4px 0 rgba(71,33,122,.35);transition:transform .15s,box-shadow .15s}
.plus-btn svg{width:1.8em;height:1.8em}
.nav button:active .plus-btn{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(71,33,122,.35)}
.bn{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;background:var(--pink);color:#fff;font-style:normal;font-size:.64rem;font-weight:700;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}

/* ---------- Contenu ---------- */
.hello{display:grid;gap:4px;margin-bottom:14px}
.h2{font-size:.95rem;font-weight:700;margin:20px 0 10px}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 rgba(47,74,158,.08)}
.bal{background:var(--grad);color:#fff;border:0;box-shadow:8px 8px 0 rgba(71,33,122,.22)}
.bal .lbl{color:rgba(255,255,255,.85)}
.bal-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.bal-row b{display:block;font-size:1.7rem;font-weight:800;line-height:1.2}
.bal-row small{color:rgba(255,255,255,.85);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{margin:0;text-align:center;padding:14px 8px}
.stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.2}
.stat span{font-size:.76rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small,.sm{color:var(--muted);font-size:.78rem}
.ava{flex:0 0 auto;display:grid;place-items:center;background:var(--grad);color:#fff;font-weight:700;overflow:hidden;box-shadow:3px 3px 0 rgba(47,74,158,.2)}
.ava img{width:100%;height:100%;object-fit:cover}
.act{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:8px}
.act>svg{color:var(--indigo);margin-top:2px}
.act p{font-size:.9rem;font-weight:500}
.act.new{border-left:4px solid var(--pink)}
.nw{margin-left:auto;font-style:normal;font-size:.66rem;font-weight:700;color:#fff;background:var(--pink);padding:2px 8px}
.pill{display:inline-block;padding:3px 10px;font-size:.7rem;font-weight:700;border-left:3px solid}
.p-todo{background:#eef2ff;color:var(--indigo);border-color:var(--indigo)}
.p-doing{background:#fff7ed;color:#c2410c;border-color:#ea580c}
.p-done{background:#ecfdf5;color:#15803d;border-color:var(--ok)}
.mission h3{font-size:1rem;margin:6px 0 4px}
.mission p{font-size:.88rem;color:var(--muted);margin-bottom:12px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:1px dashed #b6c0e0;background:rgba(255,255,255,.6)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid2 .stat{margin:0}
.list-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:12px;margin-bottom:8px;transition:transform .15s}
.list-row:active{transform:scale(.98)}
.list-row .cnt{margin-left:auto;background:var(--pink);color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px}
.list-row .amt{margin-left:auto;text-align:right;font-weight:700;font-size:.82rem;color:var(--indigo)}
.rep{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:12px}
.rep p{font-size:.92rem;margin:8px 0}
.rep .ans{background:var(--bg);border-left:4px solid var(--indigo);padding:10px 12px;font-size:.88rem;margin-top:8px}
.rep form{display:grid;gap:8px;margin-top:8px}
.rep textarea{min-height:70px}

/* ---------- Discussion ---------- */
.chat-head{padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:700}
.chat-head .back{padding:0}
.chat{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 12px;font-size:.92rem;background:#fff;border:1px solid var(--line);animation:up .3s ease;word-wrap:break-word;overflow-wrap:anywhere}
.msg small{display:block;margin-top:4px;font-size:.66rem;opacity:.7;color:inherit}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff;border-color:transparent}
.composer{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.composer input{flex:1;padding:12px}
.send{flex:0 0 50px;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:3px 3px 0 rgba(71,33,122,.3)}
.send:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(71,33,122,.3)}

/* ---------- Feuille d'actions (+) ---------- */
.sheet-bg{position:absolute;inset:0;background:rgba(18,21,58,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:18px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.7,.2,1);z-index:41;max-height:90%;overflow-y:auto;box-shadow:0 -20px 60px rgba(18,21,58,.3)}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet.open{transform:none}
.sheet-top{display:flex;align-items:center;margin-bottom:14px}
.sheet-top h3{font-size:1.1rem;font-weight:800;flex:1}
.sheet-top button{background:var(--bg);border:0;width:40px;height:40px;display:grid;place-items:center}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:10px;box-shadow:4px 4px 0 rgba(47,74,158,.08);transition:transform .15s,box-shadow .15s}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(47,74,158,.08)}
.opt .ico{width:46px;height:46px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:0 0 auto;box-shadow:3px 3px 0 rgba(71,33,122,.25)}
.opt b{display:block;font-size:.98rem}
.opt small{display:block}

/* ---------- Notifications ---------- */
#toasts{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;z-index:80;display:grid;gap:8px;pointer-events:none}
.toast{background:#fff;border:1px solid var(--line);border-left:5px solid var(--indigo);padding:12px 14px;font-size:.88rem;font-weight:600;box-shadow:6px 6px 0 rgba(47,74,158,.2);transform:translateY(-130%);opacity:0;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.toast.in{transform:none;opacity:1}
.toast.err{border-left-color:var(--bad)}
.toast.ok{border-left-color:var(--ok)}
.toast.discord{background:#2b2d6e;color:#fff;border-color:#2b2d6e;border-left-color:#5865f2}
.toast.discord b{display:block;font-size:.66rem;letter-spacing:1.2px;text-transform:uppercase;opacity:.75;margin-bottom:2px}

/* ---------- Barre de chargement (appels au serveur) ---------- */
#app.loading::before{content:"";position:absolute;top:0;left:0;height:4px;width:40%;background:var(--grad);z-index:90;animation:slide 1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ---------- Déblocage ---------- */
.unlock{position:fixed;inset:0;z-index:200;background:var(--grad);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;animation:fade .3s ease}
.unlock.out{opacity:0;transition:opacity .5s}
.u-box{width:96px;height:96px;background:#fff;color:var(--indigo);display:grid;place-items:center;box-shadow:10px 10px 0 rgba(0,0,0,.2);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
.u-box svg{width:3em;height:3em;stroke-width:3}
.unlock h2{font-size:1.6rem;font-weight:800;margin-top:14px}

/* ---------- Animations ---------- */
.rv{animation:up .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
.rv.static{animation:none!important;opacity:1}
.w{display:inline-block;animation:wordIn .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms + 80ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes wordIn{from{opacity:0;transform:translateY(.7em)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:rotate(45deg) translateY(0)}50%{transform:rotate(45deg) translateY(-14px)}}
@keyframes rip{to{transform:translate(-50%,-50%) scale(26);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Survol (souris) ---------- */
@media (hover:hover){
  .btn-primary:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(71,33,122,.3)}
  .btn-ok:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(10,90,40,.3)}
  .btn-no:hover{background:#fef2f2}
  .btn-outline:hover{background-size:100% 100%;color:#fff}
  .list-row:hover,.opt:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 rgba(47,74,158,.14)}
  .btn-primary:hover:active,.btn-ok:hover:active{transform:translate(4px,4px);box-shadow:1px 1px 0 rgba(71,33,122,.3)}
  .link-btn:hover,.back:hover{color:var(--purple)}
}

/* ---------- Ordinateur et grands écrans ---------- */
@media (min-width:860px){
  #app{max-width:none;box-shadow:none}

  /* écrans d'entrée : une carte centrée sur le fond coloré */
  .auth{align-items:center;justify-content:center;padding:40px}
  .auth-in{margin:auto;width:min(480px,100%);background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:38px 36px;border:1px solid var(--line);box-shadow:14px 14px 0 rgba(47,74,158,.16)}
  .b1{width:480px;height:480px}.b2{width:440px;height:440px}
  .cam{max-width:380px;margin-left:auto;margin-right:auto}

  /* application : en-tête en haut, menu à gauche, contenu large */
  #root.shell{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #root.shell .top{grid-column:1/-1;grid-row:1;padding:12px 28px}
  #root.shell .nav{grid-column:1;grid-row:2;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 14px;border-top:0;border-right:1px solid var(--line);box-shadow:none;overflow-y:auto}
  #root.shell .main{grid-column:2;grid-row:2;padding:32px clamp(24px,4vw,56px) 48px}
  #root.shell .main.chatmode{padding:24px clamp(24px,4vw,56px)}
  .main>*{max-width:920px;margin-left:auto;margin-right:auto}
  .main.chatmode>*{width:100%;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .main.chatmode>.chat-head{border-top:1px solid var(--line)}
  .main.chatmode>.composer{border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:repeat(4,1fr)}

  /* menu latéral */
  .nav button{height:auto;flex-direction:row;justify-content:flex-start;gap:14px;padding:13px 16px;font-size:.95rem;text-align:left}
  .nav button svg{width:1.35em;height:1.35em}
  .nav button:hover{background:var(--bg)}
  .nav button.on{background:var(--bg)}
  .nav button.on svg{transform:none}
  .nav button.on::before{top:0;bottom:0;left:0;right:auto;width:4px;height:auto;animation:none}
  .nav button[data-act="plus"]{order:-1;margin-bottom:12px;padding:0}
  .nav button[data-act="plus"]:hover{background:none}
  .plus-btn{width:100%;height:52px;margin:0;display:flex;align-items:center;justify-content:center;gap:10px}
  .plus-btn::after{content:"Nouvelle action";font-size:.92rem;font-weight:700}
  .bn{position:static;margin-left:auto;animation:none}

  /* fenêtre centrée au lieu du panneau du bas */

<script>
(function(){
'use strict';
document.documentElement.classList.add('js');

/* =====================================================================

CONFIG.DEMO=!CONFIG.API_URL;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

const fmtNum=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(n);

function normTel(s){let t=String(s==null?'':s).replace(/[\s.\-()]/g,'');if(/^00/.test(t))t='+'+t.slice(2);if(/^0\d{9}$/.test(t))t='+243'+t.slice(1);else if(/^243\d{9}$/.test(t))t='+'+t;else if(/^\d{9}$/.test(t))t='+243'+t;return /^\+\d{9,15}$/.test(t)?t:''}
const telFmt=t=>String(t||'').replace(/^(\+243)(\d{3})(\d{3})(\d{3})$/,'$1 $2 $3 $4');

}
const initials=n=>String(n||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(16)};

/* ---------- Icônes ---------- */
const P={

/* ---------- Couche API : démo (localStorage) ou Apps Script ---------- */
let pend=0;
function bar(d){pend=Math.max(0,pend+d);const a=document.getElementById('app');if(a)a.classList.toggle('loading',pend>0)}
async function remote(action,data,quiet){
  if(!quiet)bar(1);
  try{
    const body=JSON.stringify(Object.assign({action:action,auth:S.auth},data));
    const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
    return await r.json();
  }finally{if(!quiet)bar(-1)}
}
const api={};
const def=(name,fn)=>{api[name]=a=>CONFIG.DEMO?Promise.resolve().then(()=>fn(a||{})):remote(name,a||{})};
api.load=async()=>{
  if(CONFIG.DEMO)return store.load();
  const r=await remote('load',{});
  if(!r||!r.ok){const e=new Error((r&&r.error)||'load');e.auth=!!r&&r.error==='auth';throw e}
  S.ver=r.v;return r.data;
};
api.ping=async()=>{const r=await remote('ping',{},true);return r&&r.ok?r.v:null};
def('inscrire',a=>{
  const d=store.load();

});

});
def('connexionChef',a=>a.code===CONFIG.CHEF_CODE_DEMO?{ok:true}:{ok:false,error:'Code chef incorrect.'});
def('majMobileMoney',a=>{const d=store.load();const m=d.membres.find(x=>x.id===a.membre_id);const tel=normTel(a.telephone);if(!m||RESEAUX.indexOf(a.reseau)<0||!tel)return{ok:false,error:'Numéro Mobile Money invalide. Écris-le en entier, ex. 0812345678.'};m.reseau=a.reseau;m.telephone=tel;store.save(d);return{ok:true}});
def('changerCode',a=>{const d=store.load();const m=d.membres.find(x=>x.id===a.membre_id);if(!m)return{ok:false,error:'Membre introuvable.'};m.code_hash=hash(a.code);store.save(d);return{ok:true}});
def('decider',a=>{const d=store.load();const m=d.membres.find(x=>x.id===a.id);if(m){m.statut=a.statut;store.save(d)}return{ok:true}});
def('envoyerMessage',a=>{const d=store.load();d.messages.push({id:'g'+uid(),membre_id:a.membre_id,de:a.de,texte:a.texte,lu:false,date:now()});store.save(d);return{ok:true}});
def('marquerLus',a=>{const d=store.load();let n=0;d.messages.forEach(m=>{if(m.membre_id===a.membre_id&&m.de===a.de&&!m.lu){m.lu=true;n++}});if(n)store.save(d);return{ok:true}});
def('envoyerRapport',a=>{const d=store.load();d.rapports.push({id:'r'+uid(),membre_id:a.membre_id,texte:a.texte,date:now(),reponse_chef:''});store.save(d);return{ok:true}});
def('repondreRapport',a=>{const d=store.load();const r=d.rapports.find(x=>x.id===a.id);if(r){r.reponse_chef=a.texte;store.save(d)}return{ok:true}});
def('ajouterPaiement',a=>{const d=store.load();d.paiements.push({id:'p'+uid(),membre_id:a.membre_id,montant:Number(a.montant),devise:a.devise,note:a.note||'',date:now()});store.save(d);return{ok:true}});
def('ajouterMission',a=>{const d=store.load();a.membres.forEach(id=>d.missions.push({id:'t'+uid(),membre_id:id,titre:a.titre,description:a.description||'',statut:'a_faire',date:now()}));store.save(d);return{ok:true}});
def('majMission',a=>{const d=store.load();const m=d.missions.find(x=>x.id===a.id);if(m){m.statut=a.statut;store.save(d)}return{ok:true}});

/* ---------- Message Discord (simulé en démo) ---------- */
function discord(text){if(CONFIG.DEMO)toast(text,'discord')}

/* =====================================================================
   ÉTAT
   ===================================================================== */
const S={auth:null,ver:null,screen:'welcome',role:null,uid:null,tab:'home',thread:null,sheet:null,data:null,sig:'',evIds:null,reg:null,stream:null,installEvt:null,busy:false};
const D=()=>S.data;
const member=id=>D().membres.find(m=>m.id===id);
const validMembers=()=>D().membres.filter(m=>m.statut==='valide');

function totalPaid(){return D().paiements.reduce((a,p)=>{a[p.devise]=(a[p.devise]||0)+Number(p.montant);return a},{CDF:0,USD:0})}
const isChef=()=>S.role==='chef';
const isChat=()=>isChef()?(S.tab==='inbox'&&!!S.thread):S.tab==='messages';
const threadId=()=>isChef()?S.thread:S.uid;
function seenKey(){return 'bd_seen_'+(isChef()?'chef':S.uid)}
function getSeen(){try{return new Set(JSON.parse(localStorage.getItem(seenKey())||'[]'))}catch(e){return new Set()}}

/* ---------- Événements (activité + toasts + pastilles) ---------- */
function eventsMember(){
  const id=S.uid,d=D(),ev=[];
  d.paiements.filter(p=>p.membre_id===id).forEach(p=>ev.push({id:'p'+p.id,kind:'pay',date:p.date,text:'Paiement enregistré : '+money(p.montant,p.devise)+(p.note?' — '+p.note:'')}));
  d.missions.filter(m=>m.membre_id===id).forEach(m=>ev.push({id:'t'+m.id,kind:'mission',date:m.date,text:'Mission : '+m.titre}));
  d.messages.filter(m=>m.membre_id===id&&m.de==='chef').forEach(m=>ev.push({id:'g'+m.id,kind:'msg',date:m.date,text:'Message du chef : '+m.texte,unread:!m.lu}));
  d.rapports.filter(r=>r.membre_id===id&&r.reponse_chef).forEach(r=>ev.push({id:'r'+r.id,kind:'reply',date:r.date,text:'Le chef a répondu à ton rapport'}));
  return ev.sort((a,b)=>b.date.localeCompare(a.date));
}
function eventsChef(){
  const d=D(),ev=[];
  d.membres.filter(m=>m.statut==='en_attente').forEach(m=>ev.push({id:'i'+m.id,kind:'inscr',date:m.date_inscription,text:'Nouvelle inscription : '+m.nom+' ('+m.departement+')'}));
  d.messages.filter(m=>m.de==='membre').forEach(m=>{const x=member(m.membre_id);ev.push({id:'g'+m.id,kind:'msg',date:m.date,text:(x?x.nom:'Un membre')+' vous a écrit',unread:!m.lu})});
  d.rapports.forEach(r=>{const x=member(r.membre_id);ev.push({id:'r'+r.id,kind:'rapport',date:r.date,text:'Nouveau rapport de '+(x?x.nom:'?')})});
  return ev.sort((a,b)=>b.date.localeCompare(a.date));
}
const events=()=>isChef()?eventsChef():eventsMember();
const isNew=(e,seen)=>e.kind==='msg'?!!e.unread:!seen.has(e.id);
function badges(){
  const d=D(),seen=getSeen();
  if(isChef()){
    return{dash:d.membres.filter(m=>m.statut==='en_attente').length,inbox:d.messages.filter(m=>m.de==='membre'&&!m.lu).length,reports:d.rapports.filter(r=>!r.reponse_chef).length};
  }
  return{home:eventsMember().filter(e=>e.kind!=='msg'&&!seen.has(e.id)).length,messages:d.messages.filter(m=>m.membre_id===S.uid&&m.de==='chef'&&!m.lu).length};
}

function toast(text,kind,ms){
  const w=$('#toasts');if(!w)return;
  const t=document.createElement('div');

  t.innerHTML=(kind==='discord'?'<b>Discord · démo</b>':'')+'<span>'+esc(text)+'</span>';

  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('in')));
  setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),450)},ms||(kind==='discord'?3800:3000));
}
function unlockFx(){

  document.body.appendChild(o);
  setTimeout(()=>o.classList.add('out'),1800);
  setTimeout(()=>o.remove(),2400);
  try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
}

/* ---------- Effets : mots, apparition, compteurs ---------- */
function split(el){
  const txt=el.textContent;el.textContent='';
  txt.split(' ').forEach((w,i)=>{const s=document.createElement('span');s.className='w';s.style.setProperty('--i',i);s.textContent=w;el.appendChild(s);el.appendChild(document.createTextNode(' '))});
}
function countUp(el){
  const to=Number(el.dataset.count)||0;
  if(el.dataset.static==='1'||to===0){el.textContent=fmtNum(to);return}
  const t0=performance.now(),dur=900;
  (function step(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmtNum(to*e);if(k<1)requestAnimationFrame(step)})(t0);
}
function after(root,animate){
  $$('.rv',root).forEach((e,i)=>{
    if(!animate){e.classList.add('in','static');return}
    e.style.setProperty('--d',Math.min(i,10)*60+'ms');
    e.classList.add('in');
  });
  $$('[data-split]',root).forEach(el=>{if(animate)split(el)});
  $$('[data-count]',root).forEach(el=>{if(!animate)el.dataset.static='1';countUp(el)});
  const c=$('.chat',root);if(c)c.scrollTop=c.scrollHeight;
}
function snapInputs(){
  const a=document.activeElement;
  return{vals:$$('[data-keep]').map(i=>[i.id,i.value]),focus:a&&a.id&&a.hasAttribute('data-keep')?a.id:null};
}
function restoreInputs(s){
  s.vals.forEach(p=>{const i=document.getElementById(p[0]);if(i)i.value=p[1]});
  if(s.focus){const i=document.getElementById(s.focus);if(i){try{i.focus({preventScroll:true})}catch(e){i.focus()}}}
}

function renderNav(){
  const items=isChef()?NAV_CHEF:NAV_MEMBER,b=badges();

    ?'<button data-act="plus" aria-label="Actions"><span class="plus-btn">'+ic('plus')+'</span></button>'
    :'<button data-act="tab" data-tab="'+it.k+'" class="'+(S.tab===it.k?'on':'')+'">'+ic(it.i)+'<span>'+it.l+'</span>'+(b[it.k]?'<em class="bn">'+(b[it.k]>9?'9+':b[it.k])+'</em>':'')+'</button>'

function renderMain(silent){
  const el=$('#main');if(!el)return;
  const snap=silent?snapInputs():null;
  const keepScroll=silent?el.scrollTop:0;
  el.className='main'+(isChat()?' chatmode':'');
  const fn=V[(isChef()?'c_':'m_')+S.tab];
  el.innerHTML=fn?fn():'';
  if(snap)restoreInputs(snap);
  after(el,!silent);
  if(silent&&!isChat())el.scrollTop=keepScroll;
  if(!isChef()&&S.tab==='home'){markSeen();renderNav()}
  if(isChat()){
    const who=isChef()?'membre':'chef',id=threadId();
    const n=D().messages.filter(m=>m.membre_id===id&&m.de===who&&!m.lu).length;
    if(n)api.marquerLus({membre_id:id,de:who}).then(()=>refresh(false));
  }
}

     +'<h2 class="h2">Missions</h2>'+(ms.length?ms.map(x=>'<div class="act">'+ic('list')+'<div><p>'+esc(x.titre)+'</p><small>'+pill(x.statut)+'</small></div></div>').join(''):'<p class="note">Aucune mission.</p>');
  }
  return '';
}

/* =====================================================================
   CAMÉRA
   ===================================================================== */
function stopCam(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
async function startCam(){
  stopCam();
  const v=$('#cam');if(!v)return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});
    v.srcObject=S.stream;
    try{await v.play()}catch(e){}
  }catch(e){
    const m=$('#camMsg');if(m)m.textContent='Caméra indisponible ou refusée. Ouvre l’appareil photo avec le bouton ci-dessous.';
    const f=$('#camFallback');if(f)f.classList.remove('hide');
  }
}
function toJpeg(src,w,h,mirror){
  const size=480,c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d'),s=Math.min(w,h),sx=(w-s)/2,sy=(h-s)/2;
  if(mirror){x.translate(size,0);x.scale(-1,1)}
  x.drawImage(src,sx,sy,s,s,0,0,size,size);
  return c.toDataURL('image/jpeg',0.72);
}

/* =====================================================================
   NAVIGATION ENTRE ÉCRANS
   ===================================================================== */
function go(screen){
  if(S.screen==='register'&&screen!=='register')stopCam();
  S.screen=screen;
  renderScreen();
}
function renderScreen(){
  const r=$('#root');
  if(S.screen==='app'){renderApp();return}
  r.classList.remove('shell');
  const map={welcome:vWelcome,register:vRegister,pending:vPending,login:()=>vLogin(false),chefLogin:()=>vLogin(true)};
  r.innerHTML=(map[S.screen]||vWelcome)();
  after(r,true);
  if(S.screen==='register'&&S.reg&&S.reg.step===2&&!S.reg.photo)startCam();
}
function saveSession(){try{localStorage.setItem(SESS,JSON.stringify({role:S.role,uid:S.uid,token:S.auth?S.auth.token:null}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESS)}catch(e){}}
async function enterApp(role,id){
  S.role=role;S.uid=id;S.tab=role==='chef'?'dash':'home';S.thread=null;S.evIds=null;
  saveSession();
  S.data=await api.load();S.sig=JSON.stringify(S.data);
  S.evIds=new Set(events().map(e=>e.id));
  go('app');
}
function logout(){
  stopCam();clearSession();S.auth=null;S.ver=null;S.role=null;S.uid=null;S.evIds=null;S.sheet=null;S.thread=null;
  go('welcome');
}

/* =====================================================================
   ACTUALISATION (sondage toutes les 5 s)
   ===================================================================== */
async function refresh(force){
  if(!CONFIG.DEMO){
    if(!S.auth)return;
    if(!force){try{const v=await api.ping();if(v&&v===S.ver)return}catch(e){return}}
  }
  let d;try{d=await api.load()}catch(e){if(e&&e.auth){logout();toast('Session expirée. Reconnecte-toi.','err')}return}
  const sig=JSON.stringify(d),changed=sig!==S.sig;
  S.sig=sig;S.data=d;
  if(S.screen==='pending'){
    const m=member(S.uid);
    if(m&&m.statut==='valide'){unlockFx();setTimeout(()=>enterApp('membre',S.uid),900)}
    else if(m&&m.statut==='refuse'){clearSession();go('welcome');toast('Ton inscription a été refusée.','err',4500)}
    return;
  }
  if(S.screen!=='app')return;
  if(!isChef()){
    const me=member(S.uid);
    if(!me||me.statut!=='valide'){logout();toast('Ton accès n’est plus actif.','err');return}
  }
  const ev=events();
  if(S.evIds){
    ev.filter(e=>!S.evIds.has(e.id)).forEach(e=>{
      if(e.kind==='msg'&&isChat()&&(isChef()?e.text.indexOf(member(S.thread)?member(S.thread).nom:'§')===0:true))return;
      toast(e.text.length>90?e.text.slice(0,90)+'…':e.text,'info');
      try{navigator.vibrate&&navigator.vibrate(80)}catch(x){}
    });
  }
  S.evIds=new Set(ev.map(e=>e.id));
  if(changed||force){renderNav();renderMain(true);if(S.sheet&&S.sheet.kind==='membre'){$('#sheet').innerHTML=sheetHtml()}}
}

/* =====================================================================
   ACTIONS (clics)
   ===================================================================== */
const A={
  'go-register':()=>{S.reg={step:1,nom:'',departement:CONFIG.DEPARTEMENTS[0],reseau:RESEAUX[0],telephone:'',code:'',photo:''};go('register')},
  'copy-tel':el=>{const t=el.dataset.tel;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Numéro copié.','ok'),()=>toast(t,'info'))},
  'go-login':()=>go('login'),
  'go-chef':()=>go('chefLogin'),
  'go-welcome':()=>go('welcome'),
  'reg-back':()=>{stopCam();S.reg.step=1;S.reg.photo='';go('register')},
  'cam-snap':()=>{
    const v=$('#cam');
    if(!v||!v.videoWidth){toast('La caméra n’est pas encore prête.','err');return}
    S.reg.photo=toJpeg(v,v.videoWidth,v.videoHeight,true);stopCam();renderScreen();
  },
  'cam-retake':()=>{S.reg.photo='';renderScreen()},
  'reg-submit':async el=>{
    if(S.busy)return;S.busy=true;el.disabled=true;
    let r;
    try{r=await api.inscrire({nom:S.reg.nom,departement:S.reg.departement,reseau:S.reg.reseau,telephone:S.reg.telephone,code:S.reg.code,photo:S.reg.photo})}
    catch(e){S.busy=false;el.disabled=false;const x=$('#err');if(x)x.textContent='Connexion impossible. Vérifie internet et réessaie.';return}
    S.busy=false;
    if(!r.ok){el.disabled=false;const e=$('#err');if(e)e.textContent=r.error||'Erreur.';return}
    S.role='membre';S.uid=r.id;S.auth=CONFIG.DEMO?null:{role:'membre',id:r.id,token:r.token};saveSession();S.data=await api.load();S.sig=JSON.stringify(S.data);
    discord('Nouvelle inscription : '+S.reg.nom+' ('+S.reg.departement+') — photo envoyée, en attente de validation');
    S.reg=null;go('pending');
  },
  'pending-check':async()=>{await refresh(true);if(S.screen==='pending')toast('Toujours en attente de validation.','info')},
  'logout':()=>logout(),
  'install':async()=>{if(S.installEvt){S.installEvt.prompt();try{await S.installEvt.userChoice}catch(e){}S.installEvt=null;renderMain(true)}},
  'tab':el=>{S.tab=el.dataset.tab;S.thread=null;closeSheet();renderNav();renderMain(false);const m=$('#main');if(m)m.scrollTop=0},
  'go-tab':el=>{closeSheet();S.tab=el.dataset.tab;S.thread=null;renderNav();renderMain(false)},
  'plus':()=>openSheet('menu'),
  'sheet':el=>openSheet(el.dataset.kind,{mid:el.dataset.mid}),
  'sheet-pb':()=>openSheet('rapport',{type:'Problème'}),
  'sheet-close':()=>closeSheet(),
  'mission-start':async el=>{await api.majMission({id:el.dataset.id,statut:'en_cours'});await refresh(true)},
  'mission-done':async el=>{
    const m=D().missions.find(x=>x.id===el.dataset.id);
    await api.majMission({id:el.dataset.id,statut:'terminee'});
    discord((member(S.uid).nom)+' a terminé la mission : '+(m?m.titre:''));
    toast('Bravo, mission terminée !','ok');await refresh(true);
  },
  'accept':async el=>{
    const m=member(el.dataset.id);
    await api.decider({id:el.dataset.id,statut:'valide'});
    toast((m?m.nom:'Le membre')+' est accepté. Son espace est débloqué.','ok');await refresh(true);
  },
  'refuse':async el=>{
    const m=member(el.dataset.id);
    if(!confirm('Refuser l’inscription de '+(m?m.nom:'ce membre')+' ?'))return;
    await api.decider({id:el.dataset.id,statut:'refuse'});
    toast('Inscription refusée.','info');await refresh(true);
  },
  'open-member':el=>openSheet('membre',{id:el.dataset.id}),
  'open-thread':el=>{S.thread=el.dataset.id;renderNav();renderMain(false)},
  'back-thread':()=>{S.thread=null;renderNav();renderMain(false)}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});

/* ---------- Formulaires ---------- */
const F={
  'login':async f=>{
    const r=await api.connexion({nom:f.elements.nom.value,code:f.elements.code.value});
    if(!r.ok){$('#err').textContent=r.error;return}
    S.uid=r.id;S.role='membre';S.auth=CONFIG.DEMO?null:{role:'membre',id:r.id,token:r.token};
    S.data=await api.load();S.sig=JSON.stringify(S.data);
    const m=member(r.id);
    if(m.statut==='valide'){await enterApp('membre',r.id)}
    else if(m.statut==='en_attente'){saveSession();go('pending')}
    else{S.role=null;S.uid=null;S.auth=null;$('#err').textContent='Ton inscription a été refusée.'}
  },
  'login-chef':async f=>{
    const r=await api.connexionChef({code:f.elements.code.value});
    if(!r.ok){$('#err').textContent=r.error;return}
    S.auth=CONFIG.DEMO?null:{role:'chef',id:'chef',token:r.token};
    await enterApp('chef','chef');
  },
  'reg-next':async f=>{
    const nom=f.elements.nom.value.trim(),code=f.elements.code.value.trim();
    if(nom.length<2){$('#err').textContent='Écris ton nom complet.';return}
    if(!/^\d{4,6}$/.test(code)){$('#err').textContent='Le code doit avoir 4 à 6 chiffres.';return}
    const tel=normTel(f.elements.telephone.value);
    if(!tel){$('#err').textContent='Numéro Mobile Money invalide. Écris-le en entier, ex. 0812345678.';return}
    Object.assign(S.reg,{nom:nom,code:code,departement:f.elements.departement.value,reseau:f.elements.reseau.value,telephone:tel,step:2,photo:''});
    go('register');
  },
  'send-msg':async f=>{
    const texte=f.elements.texte.value.trim();if(!texte)return;
    f.elements.texte.value='';
    const id=threadId();
    await api.envoyerMessage({membre_id:id,de:isChef()?'chef':'membre',texte:texte});
    if(!isChef())discord(member(S.uid).nom+' : '+texte);
    await refresh(true);
    const i=$('#msgIn');if(i)i.focus();
  },
  'send-report':async f=>{
    const type=f.elements.type.value,texte=f.elements.texte.value.trim();if(!texte)return;
    await api.envoyerRapport({membre_id:S.uid,texte:'['+type+'] '+texte});
    discord(member(S.uid).nom+' — '+type+' : '+texte);
    closeSheet();toast('Rapport envoyé au chef.','ok');await refresh(true);
  },
  'reply-report':async f=>{
    const texte=f.elements.texte.value.trim();if(!texte)return;
    await api.repondreRapport({id:f.dataset.id,texte:texte});
    toast('Réponse envoyée.','ok');await refresh(true);
  },
  'pay':async f=>{
    const montant=Number(f.elements.montant.value);
    if(!(montant>0)){toast('Entre un montant valide.','err');return}
    const m=member(f.elements.membre.value);
    await api.ajouterPaiement({membre_id:f.elements.membre.value,montant:montant,devise:f.elements.devise.value,note:f.elements.note.value.trim()});
    closeSheet();toast('Paiement de '+money(montant,f.elements.devise.value)+' enregistré pour '+(m?m.nom:'le membre')+'.','ok');await refresh(true);
  },
  'mobile':async f=>{
    const tel=normTel(f.elements.telephone.value);
    if(!tel){toast('Numéro invalide. Écris-le en entier, ex. 0812345678.','err');return}
    const r=await api.majMobileMoney({membre_id:S.uid,reseau:f.elements.reseau.value,telephone:tel});
    if(r&&r.ok===false){toast(r.error||'Impossible d’enregistrer.','err');return}
    toast('Numéro enregistré.','ok');await refresh(true);
  },
  'newcode':async f=>{
    const code=f.elements.code.value.trim(),m=member(f.dataset.mid);
    if(!/^\d{4,6}$/.test(code)){toast('Le code doit avoir 4 à 6 chiffres.','err');return}
    const r=await api.changerCode({membre_id:f.dataset.mid,code:code});
    if(r&&r.ok===false){toast(r.error||'Impossible de changer le code.','err');return}
    f.reset();toast('Nouveau code enregistré pour '+(m?m.nom:'le membre')+'.','ok');
  },
  'mission':async f=>{
    const ids=f.elements.membre.value==='*'?validMembers().map(m=>m.id):[f.elements.membre.value];
    await api.ajouterMission({membres:ids,titre:f.elements.titre.value.trim(),description:f.elements.description.value.trim()});
    closeSheet();toast('Mission envoyée à '+(ids.length>1?'toute l’équipe':member(ids[0]).nom)+'.','ok');await refresh(true);
  }
};
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const h=F[f.dataset.form];if(!h)return;
  const btn=f.querySelector('button:not([type=button])');
  if(btn&&f.dataset.form!=='send-msg')btn.disabled=true;
  try{await h(f)}catch(err){toast('Une erreur est survenue. Réessaie.','err')}
  if(btn&&document.body.contains(btn))btn.disabled=false;
});
document.addEventListener('change',e=>{
  if(e.target.id!=='camFile'||!e.target.files[0])return;
  const img=new Image(),url=URL.createObjectURL(e.target.files[0]);
  img.onload=()=>{S.reg.photo=toJpeg(img,img.naturalWidth,img.naturalHeight,false);URL.revokeObjectURL(url);renderScreen()};
  img.src=url;
});

/* ---------- Effet d'onde au toucher ---------- */
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.btn,.opt,.nav button');if(!b||b.disabled)return;
  const r=b.getBoundingClientRect(),i=document.createElement('i');
  i.className='rip';i.style.left=(e.clientX-r.left)+'px';i.style.top=(e.clientY-r.top)+'px';
  if(b.matches('.nav button'))b.style.overflow='hidden';
  b.appendChild(i);setTimeout(()=>i.remove(),650);
},{passive:true});

/* ---------- Installation PWA ---------- */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(S.screen==='app'&&!isChef()&&S.tab==='profil')renderMain(true)});
window.addEventListener('appinstalled',()=>{S.installEvt=null});
window.addEventListener('unhandledrejection',()=>{S.busy=false;toast('Connexion impossible. Réessaie.','err')});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('bureau-sw.js',{scope:'./bureau.html'}).catch(()=>{}));
}

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
(async function init(){
  let ses=null;try{ses=JSON.parse(localStorage.getItem(SESS)||'null')}catch(e){}
  if(!CONFIG.DEMO){
    if(ses&&ses.token&&ses.uid)S.auth={role:ses.role==='chef'?'chef':'membre',id:ses.uid,token:ses.token};
    else ses=null;
  }
  if(CONFIG.DEMO||ses){
    try{S.data=await api.load();S.sig=JSON.stringify(S.data)}
    catch(e){
      if(e&&e.auth)clearSession();else toast('Connexion impossible. Vérifie internet.','err',4000);
      S.auth=null;ses=null;
    }
  }
  if(ses&&ses.role==='chef'){await enterApp('chef','chef')}
  else if(ses&&ses.role==='membre'){
    const m=member(ses.uid);
    if(m&&m.statut==='valide')await enterApp('membre',m.id);
    else if(m&&m.statut==='en_attente'){S.role='membre';S.uid=m.id;go('pending')}
    else{clearSession();go('welcome')}
  }else go('welcome');
  setInterval(()=>{if(!document.hidden)refresh(false)},CONFIG.DEMO?CONFIG.POLL_MS:CONFIG.POLL_REMOTE_MS);
  window.addEventListener('storage',e=>{if(e.key===KEY)refresh(false)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(false)});
})();
})();
</script>
